<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>

  {# Flat monochrome mark as a data URI: no external request, no extra file. #}
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='2' fill='%2317171a'/%3E%3Cpath d='M11 23V9m10 14V9M11 16h10' stroke='%23fff' stroke-width='2.4' stroke-linecap='square'/%3E%3C/svg%3E">

  {# Apply the stored theme before first paint so there is no flash. #}
  <script>
    (function () {
      try {
        var t = localStorage.getItem("homecloud-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) { /* blocked storage: the OS preference still applies */ }
    })();
  </script>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  {% include "_icons.html" %}

  {% block body %}{% endblock %}

  <div class="toasts" id="toast-region" role="status" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
